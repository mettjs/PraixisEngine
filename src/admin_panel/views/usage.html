<!-- ═══════════════════════════════════════════════════════
     USAGE VIEW — per-app token and request stats
     ═══════════════════════════════════════════════════════ -->
<div x-show="view === 'usage'">

  <!-- Loading spinner -->
  <div x-show="loading.usage" class="flex justify-center py-12">
    <span class="spinner text-slate-500 w-6 h-6 border-2"></span>
  </div>

  <!-- Empty state -->
  <div x-show="!loading.usage && usage.length === 0" class="card text-center py-14">
    <svg class="w-10 h-10 text-slate-600 mx-auto mb-3"><use href="#ic-chart"/></svg>
    <p class="text-slate-400 font-medium">No usage recorded yet</p>
    <p class="text-slate-600 text-sm mt-1">Usage data appears here once apps start making requests.</p>
  </div>

  <div x-show="!loading.usage && usage.length > 0" class="space-y-5">

    <!-- Summary cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="card">
        <p class="text-xs text-slate-500 mb-1">Total Apps</p>
        <p class="text-2xl font-bold text-slate-100" x-text="usage.length"></p>
      </div>
      <div class="card">
        <p class="text-xs text-slate-500 mb-1">Total Requests</p>
        <p class="text-2xl font-bold text-slate-100" x-text="totalUsageRequests().toLocaleString()"></p>
      </div>
      <div class="card">
        <p class="text-xs text-slate-500 mb-1">Total Tokens</p>
        <p class="text-2xl font-bold text-slate-100" x-text="totalUsageTokens().toLocaleString()"></p>
      </div>
      <div class="card">
        <p class="text-xs text-slate-500 mb-1">Avg / Request</p>
        <p class="text-2xl font-bold text-slate-100"
           x-text="totalUsageRequests() > 0
             ? Math.round(totalUsageTokens() / totalUsageRequests()).toLocaleString()
             : '—'">
        </p>
      </div>
    </div>

    <!-- Per-app table -->
    <div class="card overflow-hidden p-0">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="border-b border-slate-700/60 bg-slate-900/40">
            <tr>
              <th class="th">App Name</th>
              <th class="th text-right">Requests</th>
              <th class="th text-right">Prompt Tokens</th>
              <th class="th text-right">Completion Tokens</th>
              <th class="th text-right">Total Tokens</th>
              <th class="th">Share</th>
            </tr>
          </thead>
          <!-- One <tbody> per app (valid HTML, and the single root x-for
               needs) so an app can render its summary row plus an expanded
               per-model breakdown. -->
          <template x-for="app in usage" :key="app.app_name">
            <tbody class="divide-y divide-slate-700/40">

              <tr class="hover:bg-slate-700/20 transition-colors cursor-pointer"
                  @click="toggleAppModels(app.app_name)"
                  title="Show the per-model breakdown">
                <td class="td font-medium text-slate-100">
                  <span class="inline-block w-3 text-slate-500 transition-transform"
                        :class="expandedApp === app.app_name ? 'rotate-90' : ''">›</span>
                  <span x-text="app.app_name"></span>
                </td>
                <td class="td text-right" x-text="(app.requests || 0).toLocaleString()"></td>
                <td class="td text-right text-slate-400" x-text="(app.prompt_tokens || 0).toLocaleString()"></td>
                <td class="td text-right text-slate-400" x-text="(app.completion_tokens || 0).toLocaleString()"></td>
                <td class="td text-right font-semibold text-slate-200" x-text="(app.total_tokens || 0).toLocaleString()"></td>
                <td class="td w-36">
                  <div class="flex items-center gap-2">
                    <div class="flex-1 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                      <div class="h-full bg-brand rounded-full"
                           :style="'width: ' + (totalUsageTokens() > 0
                             ? Math.round(app.total_tokens / totalUsageTokens() * 100)
                             : 0) + '%'">
                      </div>
                    </div>
                    <span class="text-xs text-slate-500 w-9 text-right"
                          x-text="(totalUsageTokens() > 0
                            ? Math.round(app.total_tokens / totalUsageTokens() * 100)
                            : 0) + '%'">
                    </span>
                  </div>
                </td>
              </tr>

              <!-- Per-model split, fetched on expand. An app whose traffic all
                   predates model tracking simply has no rows to show. -->
              <tr x-show="expandedApp === app.app_name" class="bg-black/20">
                <td colspan="6" class="px-6 py-3">
                  <p x-show="appModels(app.app_name).length === 0"
                     class="text-xs text-slate-500">No per-model usage recorded for this app.</p>
                  <div x-show="appModels(app.app_name).length > 0" class="space-y-1">
                    <template x-for="row in appModels(app.app_name)" :key="row.model">
                      <div class="flex items-center justify-between gap-4 py-1 border-b border-slate-700/30 last:border-0">
                        <span class="text-xs font-mono text-slate-300 w-32 shrink-0" x-text="row.model"></span>
                        <span class="text-xs text-slate-500 flex-1 text-right"
                              x-text="(row.requests || 0).toLocaleString() + ' req'"></span>
                        <span class="text-xs text-slate-500 flex-1 text-right"
                              x-text="(row.prompt_tokens || 0).toLocaleString() + ' prompt'"></span>
                        <span class="text-xs text-slate-500 flex-1 text-right"
                              x-text="(row.completion_tokens || 0).toLocaleString() + ' completion'"></span>
                        <span class="text-xs font-semibold text-slate-200 flex-1 text-right"
                              x-text="(row.total_tokens || 0).toLocaleString() + ' total'"></span>
                      </div>
                    </template>
                  </div>
                </td>
              </tr>

            </tbody>
          </template>
        </table>
      </div>
    </div>

  </div>
</div>
